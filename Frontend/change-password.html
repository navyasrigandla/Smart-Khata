<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set New Password | SMART KHATA</title>
  <link rel="stylesheet" href="app.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <p class="eyebrow">FIRST LOGIN</p>
    <h2>Change Your Temporary Password</h2>
    <p class="helper-text">Enter the temporary password given by the shopkeeper, then set your own new password.</p>
    <input type="password" id="tempPassword" placeholder="Temporary Password">
    <input type="password" id="newPassword" placeholder="New Password">
    <button onclick="setNewPassword()">Save Password</button>
  </main>
  <script src="app.js"></script>
</body>
</html>
