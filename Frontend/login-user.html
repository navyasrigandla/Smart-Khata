<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Login | SMART KHATA</title>
  <link rel="stylesheet" href="app.css">
</head>
<body class="auth-page">
  <main class="auth-card">
    <p class="eyebrow">SMART KHATA</p>
    <h2>Customer Login</h2>
    <p class="helper-text">Login with your phone number and the password saved by the shopkeeper.</p>
    <input type="text" id="phone" placeholder="Phone Number">
    <input type="password" id="password" placeholder="Password">
    <button onclick="userLogin()">Login</button>
    <p class="helper-text">Use the temporary password from the shopkeeper for your first login.</p>
  </main>
  <script src="app.js"></script>
</body>
</html>
