<svg width="900" height="1180" viewBox="0 0 900 1180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="1180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7E7C8"/>
      <stop offset="1" stop-color="#E8F3EA"/>
    </linearGradient>
    <linearGradient id="card" x1="450" y1="0" x2="450" y2="1180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF9EF"/>
      <stop offset="1" stop-color="#FFFDF7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#7C2D12" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="6" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12L3.5 6L0 0Z" fill="#9A3412"/>
    </marker>
    <style>
      .title { font: 700 34px 'Segoe UI', sans-serif; fill: #1F2933; }
      .subtitle { font: 500 17px 'Segoe UI', sans-serif; fill: #64748B; }
      .box-title { font: 700 24px 'Segoe UI', sans-serif; fill: #1F2933; }
      .box-text { font: 500 17px 'Segoe UI', sans-serif; fill: #475569; }
      .small { font: 600 15px 'Segoe UI', sans-serif; fill: #9A3412; letter-spacing: 0.08em; }
      .line { stroke: #9A3412; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="900" height="1180" rx="32" fill="url(#bg)"/>
  <rect x="34" y="34" width="832" height="1112" rx="28" fill="url(#card)" opacity="0.94"/>

  <text x="450" y="92" text-anchor="middle" class="small">SMART KHATA</text>
  <text x="450" y="132" text-anchor="middle" class="title">Data Flow Diagram</text>
  <text x="450" y="164" text-anchor="middle" class="subtitle">Vertical flow of data between users, frontend, backend, logic, and database</text>

  <g filter="url(#shadow)">
    <rect x="220" y="220" width="460" height="110" rx="28" fill="#FFF7ED" stroke="#FDBA74" stroke-width="2"/>
    <text x="450" y="265" text-anchor="middle" class="box-title">1. Users</text>
    <text x="450" y="298" text-anchor="middle" class="box-text">Shopkeeper and Customer</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="180" y="390" width="540" height="120" rx="28" fill="#FEFCE8" stroke="#FDE68A" stroke-width="2"/>
    <text x="450" y="438" text-anchor="middle" class="box-title">2. Frontend Layer</text>
    <text x="450" y="472" text-anchor="middle" class="box-text">HTML, CSS, JavaScript</text>
    <text x="450" y="498" text-anchor="middle" class="box-text">Login pages, dashboards, forms, payment UI</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="185" y="580" width="530" height="120" rx="28" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2"/>
    <text x="450" y="628" text-anchor="middle" class="box-title">3. Express Server</text>
    <text x="450" y="662" text-anchor="middle" class="box-text">Node.js + Express</text>
    <text x="450" y="688" text-anchor="middle" class="box-text">Receives API requests and sends JSON responses</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="165" y="770" width="570" height="140" rx="28" fill="#F0FDF4" stroke="#86EFAC" stroke-width="2"/>
    <text x="450" y="818" text-anchor="middle" class="box-title">4. Business Logic</text>
    <text x="450" y="852" text-anchor="middle" class="box-text">Authentication, customer management, item updates</text>
    <text x="450" y="880" text-anchor="middle" class="box-text">payments, reminders, notes, overdue calculation</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="205" y="980" width="490" height="120" rx="28" fill="#F5F3FF" stroke="#C4B5FD" stroke-width="2"/>
    <text x="450" y="1028" text-anchor="middle" class="box-title">5. SQLite Database</text>
    <text x="450" y="1062" text-anchor="middle" class="box-text">Persistent storage for shopkeeper, customers,</text>
    <text x="450" y="1088" text-anchor="middle" class="box-text">items, payments, reminders, and notes</text>
  </g>

  <line x1="450" y1="330" x2="450" y2="388" class="line" marker-end="url(#arrow)"/>
  <line x1="450" y1="510" x2="450" y2="578" class="line" marker-end="url(#arrow)"/>
  <line x1="450" y1="700" x2="450" y2="768" class="line" marker-end="url(#arrow)"/>
  <line x1="450" y1="910" x2="450" y2="978" class="line" marker-end="url(#arrow)"/>

  <path d="M735 1038C805 1038 818 948 818 840C818 680 818 470 818 450C818 425 800 420 770 420" class="line" fill="none" marker-end="url(#arrow)"/>
  <text x="812" y="734" text-anchor="middle" transform="rotate(90 812 734)" class="subtitle">Stored data returns to app as response</text>

  <path d="M165 840C95 840 82 744 82 640C82 470 82 280 82 275C82 248 102 245 130 245" class="line" fill="none" marker-end="url(#arrow)"/>
  <text x="88" y="548" text-anchor="middle" transform="rotate(-90 88 548)" class="subtitle">Updated information shown back to users</text>
</svg>
